name: Python unit tests
on:
  pull_request:
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused YouTube client tests
        run: python -m unittest discover -s tests -v
